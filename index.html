<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APA Reference Builder Lab</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #d7deea;
      --accent: #23408e;
      --accent-2: #3b82f6;
      --soft: #eaf1ff;
      --success: #1f7a42;
      --success-bg: #e9f8ef;
      --warn: #9a6700;
      --warn-bg: #fff6dd;
      --danger: #a4282a;
      --danger-bg: #fdeeee;
      --shadow: 0 10px 30px rgba(35, 64, 142, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    button, input, select, textarea {
      font: inherit;
    }

    a {
      color: var(--accent);
    }

    .app {
      max-width: 1180px;
      margin: 0 auto;
      padding: 22px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .title-block h1 {
      margin: 0;
      font-size: 1.95rem;
    }

    .title-block p {
      margin: 4px 0 0;
      color: var(--muted);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: 1px solid var(--line);
      background: white;
      color: var(--text);
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
      transition: 0.18s ease;
      box-shadow: 0 1px 0 rgba(0,0,0,0.02);
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: #c2cde0;
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .btn-secondary {
      background: var(--soft);
      border-color: #c8d8ff;
      color: var(--accent);
    }

    .btn-ghost {
      background: transparent;
    }

    .progress-shell {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      margin-bottom: 18px;
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .progress-track {
      width: 100%;
      height: 12px;
      background: #e8edf7;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      width: 0%;
      transition: width 0.25s ease;
    }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .chip {
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #f8faff;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .chip.active {
      background: var(--soft);
      color: var(--accent);
      border-color: #bfd2ff;
      font-weight: bold;
    }

    .chip.done {
      background: #ebfff3;
      color: var(--success);
      border-color: #bce5cb;
      font-weight: bold;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
      margin-bottom: 18px;
    }

    .panel h2, .panel h3 {
      margin-top: 0;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 18px;
      align-items: stretch;
    }

    .hero-card {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      background: linear-gradient(180deg, #ffffff, #f9fbff);
    }

    .hero-card ul {
      margin-bottom: 0;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 18px;
    }

    .artifact-wrap {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fbfcff;
      padding: 16px;
      min-height: 360px;
    }

    .artifact-label {
      display: inline-block;
      margin-bottom: 10px;
      font-size: 0.88rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--accent);
      background: #edf3ff;
      border: 1px solid #d6e4ff;
      border-radius: 999px;
      padding: 6px 10px;
    }

    .artifact {
      background: white;
      border: 1px solid #dfe5f0;
      border-radius: 14px;
      padding: 16px;
      color: #1e293b;
    }

    .artifact .meta-faint {
      color: #64748b;
      font-size: 0.94rem;
    }

    .artifact .source-title {
      font-size: 1.5rem;
      margin: 10px 0 6px;
      font-weight: bold;
    }

    .artifact .journal-title {
      font-size: 1.18rem;
      font-style: italic;
      margin: 8px 0;
    }

    .artifact .book-title {
      font-size: 1.35rem;
      margin: 10px 0 8px;
      font-weight: bold;
    }

    .artifact .webpage-title {
      font-size: 1.5rem;
      margin: 10px 0 6px;
      font-weight: bold;
    }

    .artifact .rule {
      border-top: 1px solid #e6ebf4;
      margin: 12px 0;
    }

    .task-box {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      background: white;
      margin-bottom: 16px;
    }

    .task-box h4 {
      margin: 0 0 10px;
    }

    .option-list {
      display: grid;
      gap: 10px;
    }

    .option {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: #fcfdff;
      cursor: pointer;
      transition: 0.18s ease;
    }

    .option:hover {
      border-color: #bfd2ff;
      background: #f7faff;
    }

    .option input {
      margin-right: 10px;
    }

    .builder-form {
      display: grid;
      gap: 14px;
    }

    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      font-weight: bold;
      font-size: 0.96rem;
    }

    .field input, .field textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 12px;
      background: #fff;
    }

    textarea {
      min-height: 84px;
      resize: vertical;
    }

    .helper {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .feedback-columns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 16px;
    }

    .feedback-card {
      border-radius: 16px;
      padding: 16px;
      border: 1px solid var(--line);
      min-height: 170px;
    }

    .feedback-card h4 {
      margin-top: 0;
    }

    .feedback-card.success {
      background: var(--success-bg);
      border-color: #bce5cb;
    }

    .feedback-card.warn {
      background: var(--warn-bg);
      border-color: #ead18d;
    }

    .feedback-card.danger {
      background: var(--danger-bg);
      border-color: #efc0c2;
    }

    .feedback-card ul {
      margin-bottom: 0;
      padding-left: 18px;
    }

    .verify-panel {
      margin-top: 16px;
      border: 1px dashed #b7c7e8;
      border-radius: 16px;
      padding: 16px;
      background: #f8fbff;
    }

    .reference-preview {
      background: white;
      border: 1px solid #d9e3f4;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
      line-height: 1.7;
    }

    .reference-preview .ital {
      font-style: italic;
    }

    .example-card {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      background: white;
      margin-bottom: 16px;
    }

    .example-card .prompt {
      font-weight: bold;
      margin-bottom: 12px;
    }

    .example-options {
      display: grid;
      gap: 10px;
    }

    .example-option {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: #fcfdff;
      cursor: pointer;
    }

    .example-option:hover {
      background: #f7faff;
      border-color: #bed1ff;
    }

    .example-option input {
      margin-right: 10px;
    }

    .status-line {
      margin-top: 12px;
      font-weight: bold;
    }

    .callout {
      border-left: 5px solid var(--accent);
      background: #f7faff;
      padding: 14px 16px;
      border-radius: 12px;
    }

    .mini-list {
      margin: 8px 0 0;
      padding-left: 18px;
    }

    .badge-stage {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 18px;
      align-items: start;
    }

    .badge-box {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      background: white;
      text-align: center;
    }

    canvas {
      width: 100%;
      max-width: 320px;
      height: auto;
      border-radius: 14px;
      border: 1px solid #dfe5f0;
      background: white;
    }

    .inline-code {
      font-family: Consolas, Monaco, monospace;
      background: #eef3fb;
      border-radius: 6px;
      padding: 2px 6px;
    }

    .footer-actions {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .small {
      font-size: 0.92rem;
      color: var(--muted);
    }

    @media (max-width: 960px) {
      .hero, .grid-2, .feedback-columns, .badge-stage, .field-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app" id="app"></div>

  <script>
    const APA_LINK = 'https://apastyle.apa.org/style-grammar-guidelines/references/examples';

    const appState = {
      currentView: 'orientation',
      historyStack: [],
      userName: '',
      examplePhaseComplete: false,
      currentExampleIndex: 0,
      currentSourceIndex: 0,
      exampleResponses: {},
      builderProgress: {},
      decisionResponses: {},
      formResponses: {},
      feedbackBySource: {},
      verifyOpen: {},
      completionReady: false
    };

    const sourceOrder = ['journal_article', 'webpage_author', 'book', 'webpage_no_author', 'chapter_edited_book'];

    const sourceLibrary = {
      journal_article: {
        id: 'journal_article',
        label: 'Journal Article',
        shortLabel: 'Journal',
        artifactLabel: 'Article First Page',
        artifactHtml: `
          <div class="artifact">
            <div class="meta-faint">Digital Communication Review</div>
            <div class="source-title">How Interface Friction Shapes Student Citation Accuracy</div>
            <div>John A. Smith and Priya R. Lee</div>
            <div class="meta-faint">Department of Communication, Great Lakes University</div>
            <div class="rule"></div>
            <div class="journal-title">Digital Communication Review</div>
            <div>2021, Vol. 14, No. 2, 123-135</div>
            <div class="meta-faint">Received March 10, 2020 • Accepted January 4, 2021</div>
            <div class="rule"></div>
            <p class="meta-faint">Abstract. This study examines interface design and citation learning...</p>
          </div>
        `,
        decisions: [
          {
            id: 'author_choice',
            prompt: 'Which names should be treated as the article authors in the reference?',
            options: [
              { value: 'authors', label: 'John A. Smith and Priya R. Lee' },
              { value: 'journal', label: 'Digital Communication Review' },
              { value: 'department', label: 'Department of Communication, Great Lakes University' }
            ],
            correct: 'authors',
            blockIfWrong: true,
            success: 'You identified the correct article authors.',
            correction: 'Use the people who wrote the article, not the journal title or department.'
          },
          {
            id: 'date_choice',
            prompt: 'Which date belongs in the reference?',
            options: [
              { value: 'publication_year', label: '2021' },
              { value: 'received', label: 'March 10, 2020' },
              { value: 'accepted', label: 'January 4, 2021' }
            ],
            correct: 'publication_year',
            blockIfWrong: true,
            success: 'You selected the publication date used in the reference.',
            correction: 'Use the publication year, not received or accepted dates.'
          }
        ],
        fields: [
          { key: 'author', label: 'Author', placeholder: 'Enter authors as they should appear in the reference' },
          { key: 'year', label: 'Year', placeholder: 'Example: 2021' },
          { key: 'title', label: 'Article title', placeholder: 'Enter the article title' },
          { key: 'journal', label: 'Journal title', placeholder: 'Enter the journal title' },
          { key: 'volumeIssue', label: 'Volume(issue)', placeholder: 'Example: 14(2)' },
          { key: 'pages', label: 'Page range', placeholder: 'Example: 123–135' }
        ],
        correctData: {
          authorRaw: 'John A. Smith and Priya R. Lee',
          authorAPA: 'Smith, J. A., & Lee, P. R.',
          yearRaw: '2021',
          yearAPA: '(2021).',
          titleRaw: 'How Interface Friction Shapes Student Citation Accuracy',
          titleAPA: 'How interface friction shapes student citation accuracy.',
          journalRaw: 'Digital Communication Review',
          journalAPA: 'Digital Communication Review',
          volumeIssueRaw: '14, 2',
          volumeIssueAPA: '14(2)',
          pagesRaw: '123-135',
          pagesAPA: '123–135'
        },
        buildReference() {
          return `${this.correctData.authorAPA} ${this.correctData.yearAPA} ${this.correctData.titleAPA} <span class="ital">${this.correctData.journalAPA}</span>, <span class="ital">${this.correctData.volumeIssueAPA.split('(')[0]}</span>(${this.correctData.volumeIssueAPA.match(/\((.*)\)/)[1]}), ${this.correctData.pagesAPA}.`;
        }
      },

      webpage_author: {
        id: 'webpage_author',
        label: 'Webpage with Author',
        shortLabel: 'Webpage + Author',
        artifactLabel: 'Webpage Header',
        artifactHtml: `
          <div class="artifact">
            <div class="meta-faint">The Learning Lab</div>
            <div class="webpage-title">Why Students Misread Source Details Online</div>
            <div>By Maya Patel</div>
            <div class="meta-faint">Updated July 18, 2023</div>
            <div class="meta-faint">First published May 9, 2022</div>
            <div class="rule"></div>
            <div class="meta-faint">Home / Teaching Strategies / Research Writing</div>
            <p>This guide explains common mistakes students make when interpreting online source information...</p>
            <div class="rule"></div>
            <div class="meta-faint">https://www.thelearninglab.org/teaching/why-students-misread-source-details</div>
          </div>
        `,
        decisions: [
          {
            id: 'author_choice',
            prompt: 'Which person should be listed as the author in the reference?',
            options: [
              { value: 'maya', label: 'Maya Patel' },
              { value: 'site', label: 'The Learning Lab' },
              { value: 'section', label: 'Teaching Strategies' }
            ],
            correct: 'maya',
            blockIfWrong: true,
            success: 'You identified the webpage author correctly.',
            correction: 'Use the named author, not the site name or section label.'
          },
          {
            id: 'date_choice',
            prompt: 'Which date is the best choice for the reference?',
            options: [
              { value: 'updated', label: 'July 18, 2023' },
              { value: 'published', label: 'May 9, 2022' },
              { value: 'none', label: 'No date should be used' }
            ],
            correct: 'updated',
            blockIfWrong: true,
            success: 'You selected the most relevant webpage date.',
            correction: 'Use the current page date shown on the webpage for this exercise.'
          }
        ],
        fields: [
          { key: 'author', label: 'Author', placeholder: 'Enter the author name' },
          { key: 'date', label: 'Date', placeholder: 'Example: July 18, 2023' },
          { key: 'title', label: 'Page title', placeholder: 'Enter the page title' },
          { key: 'siteName', label: 'Website name', placeholder: 'Enter the website name' },
          { key: 'url', label: 'URL', placeholder: 'Enter the URL' }
        ],
        correctData: {
          authorRaw: 'Maya Patel',
          authorAPA: 'Patel, M.',
          dateRaw: 'July 18, 2023',
          dateAPA: '(2023, July 18).',
          titleRaw: 'Why Students Misread Source Details Online',
          titleAPA: 'Why students misread source details online.',
          siteNameRaw: 'The Learning Lab',
          siteNameAPA: 'The Learning Lab',
          urlRaw: 'https://www.thelearninglab.org/teaching/why-students-misread-source-details'
        },
        buildReference() {
          return `${this.correctData.authorAPA} ${this.correctData.dateAPA} ${this.correctData.titleAPA} <span class="ital">${this.correctData.siteNameAPA}</span>. ${this.correctData.urlRaw}`;
        }
      },

      book: {
        id: 'book',
        label: 'Book',
        shortLabel: 'Book',
        artifactLabel: 'Book Front Matter',
        artifactHtml: `
          <div class="artifact">
            <div class="book-title">Writing Research in Everyday Contexts</div>
            <div>Elena Martinez</div>
            <div class="meta-faint">Second edition</div>
            <div class="rule"></div>
            <div>Riverbend Academic Press</div>
            <div class="meta-faint">Boston</div>
            <div class="meta-faint">Copyright © 2020</div>
            <div class="meta-faint">Library of Congress data available on request</div>
          </div>
        `,
        decisions: [
          {
            id: 'author_choice',
            prompt: 'Who should be treated as the author of this source?',
            options: [
              { value: 'martinez', label: 'Elena Martinez' },
              { value: 'publisher', label: 'Riverbend Academic Press' },
              { value: 'location', label: 'Boston' }
            ],
            correct: 'martinez',
            blockIfWrong: true,
            success: 'You identified the book author correctly.',
            correction: 'Use the person who wrote the book, not the publisher or place.'
          }
        ],
        fields: [
          { key: 'author', label: 'Author', placeholder: 'Enter the author' },
          { key: 'year', label: 'Year', placeholder: 'Example: 2020' },
          { key: 'title', label: 'Book title', placeholder: 'Enter the book title' },
          { key: 'publisher', label: 'Publisher', placeholder: 'Enter the publisher' }
        ],
        correctData: {
          authorRaw: 'Elena Martinez',
          authorAPA: 'Martinez, E.',
          yearRaw: '2020',
          yearAPA: '(2020).',
          titleRaw: 'Writing Research in Everyday Contexts',
          titleAPA: 'Writing research in everyday contexts',
          publisherRaw: 'Riverbend Academic Press',
          publisherAPA: 'Riverbend Academic Press'
        },
        buildReference() {
          return `${this.correctData.authorAPA} ${this.correctData.yearAPA} <span class="ital">${this.correctData.titleAPA}</span>. ${this.correctData.publisherAPA}.`;
        }
      },

      webpage_no_author: {
        id: 'webpage_no_author',
        label: 'Webpage with No Author',
        shortLabel: 'Webpage No Author',
        artifactLabel: 'Webpage Header',
        artifactHtml: `
          <div class="artifact">
            <div class="meta-faint">Campus Writing Center</div>
            <div class="webpage-title">Reference List Checklist</div>
            <div class="meta-faint">Revised September 2, 2024</div>
            <div class="meta-faint">Student Support Resources</div>
            <div class="rule"></div>
            <p>Use this checklist to review author order, titles, dates, and source elements before submitting your work.</p>
            <div class="rule"></div>
            <div class="meta-faint">https://campuswritingcenter.edu/reference-list-checklist</div>
          </div>
        `,
        decisions: [
          {
            id: 'title_choice',
            prompt: 'Because no author is listed, what should move into the author position?',
            options: [
              { value: 'page_title', label: 'Reference List Checklist' },
              { value: 'site_name', label: 'Campus Writing Center' },
              { value: 'section', label: 'Student Support Resources' }
            ],
            correct: 'page_title',
            blockIfWrong: true,
            success: 'You identified the correct element to begin the reference.',
            correction: 'With no author, begin with the page title.'
          },
          {
            id: 'date_choice',
            prompt: 'Which date should you use?',
            options: [
              { value: 'revised', label: 'September 2, 2024' },
              { value: 'none', label: 'No date' },
              { value: 'site', label: 'Campus Writing Center' }
            ],
            correct: 'revised',
            blockIfWrong: true,
            success: 'You selected the date shown on the page.',
            correction: 'Use the page date if it appears; do not invent n.d. when a date is provided.'
          }
        ],
        fields: [
          { key: 'title', label: 'Page title', placeholder: 'Enter the page title' },
          { key: 'date', label: 'Date', placeholder: 'Example: September 2, 2024' },
          { key: 'siteName', label: 'Website name', placeholder: 'Enter the website name' },
          { key: 'url', label: 'URL', placeholder: 'Enter the URL' }
        ],
        correctData: {
          titleRaw: 'Reference List Checklist',
          titleAPA: 'Reference list checklist.',
          dateRaw: 'September 2, 2024',
          dateAPA: '(2024, September 2).',
          siteNameRaw: 'Campus Writing Center',
          siteNameAPA: 'Campus Writing Center',
          urlRaw: 'https://campuswritingcenter.edu/reference-list-checklist'
        },
        buildReference() {
          return `${this.correctData.titleAPA} ${this.correctData.dateAPA} <span class="ital">${this.correctData.siteNameAPA}</span>. ${this.correctData.urlRaw}`;
        }
      },

      chapter_edited_book: {
        id: 'chapter_edited_book',
        label: 'Chapter in an Edited Book',
        shortLabel: 'Chapter',
        artifactLabel: 'Book Contents + Chapter Opening',
        artifactHtml: `
          <div class="artifact">
            <div class="meta-faint">From the book</div>
            <div class="book-title">Teaching Writing Across Contexts</div>
            <div>Edited by Morgan Chen and Felicia Gomez</div>
            <div class="meta-faint">North Street Press • 2022</div>
            <div class="rule"></div>
            <div class="source-title" style="font-size:1.2rem;">Chapter 4. Learning Through Worked Examples</div>
            <div>Janelle Brooks</div>
            <div class="meta-faint">pp. 77-101</div>
            <div class="rule"></div>
            <p class="meta-faint">This chapter examines the relationship between guided models and transfer...</p>
          </div>
        `,
        decisions: [
          {
            id: 'chapter_author_choice',
            prompt: 'Which person is the chapter author?',
            options: [
              { value: 'brooks', label: 'Janelle Brooks' },
              { value: 'chen', label: 'Morgan Chen' },
              { value: 'gomez', label: 'Felicia Gomez' }
            ],
            correct: 'brooks',
            blockIfWrong: true,
            success: 'You identified the chapter author correctly.',
            correction: 'Use the person who wrote the chapter, not the editors of the book.'
          },
          {
            id: 'editor_choice',
            prompt: 'Who are the editors of the book?',
            options: [
              { value: 'editors', label: 'Morgan Chen and Felicia Gomez' },
              { value: 'author', label: 'Janelle Brooks' },
              { value: 'publisher', label: 'North Street Press' }

    function shuffle(array) {
      const clone = array.slice();
      for (let i = clone.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [clone[i], clone[j]] = [clone[j], clone[i]];
      }
      return clone;
    }

    function sanitize(value) {
      return (value || '').trim().replace(/\s+/g, ' ');
    }

    function normalizeForCompare(value) {
      return sanitize(value)
        .toLowerCase()
        .replace(/[“”"'.,:;!?()]/g, '')
        .replace(/–/g, '-')
        .replace(/&/g, 'and');
    }

    function normalizePages(value) {
      return sanitize(value).replace(/–/g, '-').replace(/\s+/g, '');
    }

    function sentenceCase(str) {
      const clean = sanitize(str);
      if (!clean) return '';
      return clean.charAt(0).toUpperCase() + clean.slice(1).toLowerCase();
    }

    function hasInitialsPattern(value) {
      return /\b[A-Z]\./.test(value);
    }

    function titleLooksSentenceCase(value) {
      const clean = sanitize(value);
      if (!clean) return false;
      const words = clean.split(' ');
      return words.slice(1).filter(Boolean).every(word => {
        const stripped = word.replace(/[^A-Za-z]/g, '');
        if (!stripped) return true;
        return stripped[0] === stripped[0].toLowerCase();
      });
    }

    function drawBadge() {
      const canvas = document.getElementById('badgeCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const name = sanitize(appState.userName) || 'Student';
      canvas.width = 900;
      canvas.height = 900;

      const gradient = ctx.createLinearGradient(0, 0, 900, 900);
      gradient.addColorStop(0, '#18347c');
      gradient.addColorStop(1, '#4d86ff');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 900, 900);

      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.beginPath();
      ctx.arc(720, 180, 120, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(220, 760, 170, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      roundRect(ctx, 90, 90, 720, 720, 40, true, false);

      ctx.strokeStyle = '#d5e1ff';
      ctx.lineWidth = 10;
      roundRect(ctx, 120, 120, 660, 660, 34, false, true);

      ctx.fillStyle = '#23408e';
      ctx.beginPath();
      ctx.arc(450, 290, 92, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 16;
      ctx.beginPath();
      ctx.moveTo(408, 288);
      ctx.lineTo(440, 322);
      ctx.lineTo(496, 252);
      ctx.stroke();

      ctx.fillStyle = '#183153';
      ctx.font = 'bold 44px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('APA Reference Builder Lab', 450, 440);

      ctx.fillStyle = '#456086';
      ctx.font = '28px Arial';
      ctx.fillText('Completion Badge', 450, 488);

      ctx.fillStyle = '#23408e';
      ctx.font = 'bold 38px Arial';
      ctx.fillText(name, 450, 585);

      ctx.fillStyle = '#60708f';
      ctx.font = '24px Arial';
      ctx.fillText('Identified, classified, and formatted core APA references', 450, 640);
      ctx.fillText(new Date().toLocaleDateString(), 450, 680);
    }

    function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      if (fill) ctx.fill();
      if (stroke) ctx.stroke();
    }

            <p>This lab is designed to help you do two things: identify the right source information in realistic contexts and format that information into APA references.</p>
            <div class="callout">
              You will move through three kinds of thinking in order: <strong>interpret</strong>, <strong>classify</strong>, and <strong>format</strong>.
            </div>
            <ul>
              <li><strong>First:</strong> complete all of the “Find the Right APA Example” practice items.</li>
              <li><strong>Next:</strong> work through the Builder Lab source by source.</li>
              <li><strong>Finally:</strong> generate a completion badge image you can copy or download.</li>
            </ul>
          </div>
          <div class="hero-card">
            <h3>How feedback works</h3>
            <ul>
              <li><strong>Correct identification:</strong> you found the right source information.</li>
              <li><strong>APA conversion needed:</strong> your information is right, but formatting still needs adjustment.</li>
              <li><strong>Incorrect understanding:</strong> you chose the wrong author, date, title role, editor, or source element.</li>
            </ul>
            <p><strong>Important:</strong> only incorrect understanding blocks completion.</p>
            <div class="field" style="margin-top:14px;">
              <label for="studentName">Your name for the completion badge</label>
              <input id="studentName" type="text" value="${escapeHtml(appState.userName)}" oninput="appState.userName=this.value" placeholder="Enter your name" />
            </div>
          </div>
        </div>

        <div class="panel">
          <h3>Source types in this lab</h3>
          <div class="chips">
            ${sourceOrder.map(id => `<div class="chip">${sourceLibrary[id].label}</div>`).join('')}
          </div>
          <div class="footer-actions">
            <div class="small">You will see source information in realistic artifact views rather than clean labeled metadata. That means you need to interpret what belongs in the reference.</div>
            <button class="btn btn-primary" onclick="navigateTo('examples')">Start Example Practice</button>
          </div>
        </div>
      `;
    }

    function renderExamples() {
      const example = preparedExamples[appState.currentExampleIndex];
      const selected = appState.exampleResponses[example.id];
      const result = example.result;
      return `
        <div class="panel">
          <h2>Find the Right APA Example</h2>
          <p>Work through all source types here first. This is a one-time practice phase before the Builder Lab. The correct answer is randomized each time the page loads.</p>
          <div class="chips">
            ${preparedExamples.map((ex, index) => {
              const cls = ex.result === true ? 'done' : index === appState.currentExampleIndex ? 'active' : '';
              return `<div class="chip ${cls}">${index + 1}. ${sourceLibrary[ex.sourceId].shortLabel}</div>`;
            }).join('')}
          </div>
        </div>

        <div class="example-card">
          <div class="prompt">${appState.currentExampleIndex + 1}. ${example.prompt}</div>
          <p class="helper"><strong>Source cue:</strong> ${example.artifactSnippet}</p>
          <div class="example-options">
            ${example.options.map((opt, index) => `
              <label class="example-option">
                <input type="radio" name="exampleOption" ${selected === index ? 'checked' : ''} onclick="selectExampleOption('${example.id}', ${index})" />
                ${escapeHtml(opt.text)}
              </label>
            `).join('')}
          </div>
          ${result === true ? `<div class="status-line" style="color: var(--success);">Correct. Move on to the next source type.</div>` : result === false ? `<div class="status-line" style="color: var(--danger);">Not quite. Review source type patterns and try again.</div>` : ''}
          <div class="footer-actions">
            <div class="small">Focus on source type logic: which elements appear, what order they take, and when a container is needed.</div>
            <button class="btn btn-primary" onclick="submitExample()">Check Answer</button>
          </div>
        </div>
      `;
    }

    function renderBuilder() {
      const source = currentSource();
      const sourceId = source.id;
      const values = getBuilderFormValues(sourceId);
      const feedback = appState.feedbackBySource[sourceId];
      const decisions = appState.decisionResponses[sourceId] || {};

      return `
        <div class="panel">
          <h2>Builder Lab</h2>
          <p>For each source, inspect the artifact, make a few key decisions, and then build the reference. You can move on once your source understanding is correct, even if some APA formatting still needs refinement.</p>
          <div class="chips">
            ${sourceOrder.map((id, index) => {
              const cls = appState.builderProgress[id] ? 'done' : index === appState.currentSourceIndex ? 'active' : '';
              return `<div class="chip ${cls}">${index + 1}. ${sourceLibrary[id].shortLabel}</div>`;
            }).join('')}
          </div>
        </div>

        <div class="grid-2">
          <div class="panel">
            <h3>1. Inspect the Source</h3>
            <div class="artifact-wrap">
              <div class="artifact-label">${source.artifactLabel}</div>
              ${source.artifactHtml}
            </div>
          </div>

          <div class="panel">
            <h3>2. Make Key Decisions</h3>
            ${source.decisions.map(decision => `
              <div class="task-box">
                <h4>${decision.prompt}</h4>
                <div class="option-list">
                  ${decision.options.map(opt => `
                    <label class="option">
                      <input type="radio" name="${decision.id}" ${decisions[decision.id] === opt.value ? 'checked' : ''} onclick="updateDecision('${sourceId}', '${decision.id}', '${opt.value}'); render();" />
                      ${escapeHtml(opt.label)}
                    </label>
                  `).join('')}
                </div>
              </div>
            `).join('')}
          </div>
        </div>

        <div class="panel">
          <h3>3. Build the Reference</h3>
          <div class="builder-form">
            <div class="field-grid">
              ${source.fields.map(field => `
                <div class="field">
                  <label for="${sourceId}_${field.key}">${field.label}</label>
                  <input
                    id="${sourceId}_${field.key}"
                    type="text"
                    value="${escapeHtml(values[field.key] || '')}"
                    placeholder="${escapeHtml(field.placeholder || '')}"
                    oninput="updateBuilderField('${sourceId}', '${field.key}', this.value)"
                  />
                </div>
              `).join('')}
            </div>
            <div class="footer-actions">
              <div class="small">Use what you can infer from the artifact. Do not worry if your APA formatting is not perfect on the first try.</div>
              <div>
                <button class="btn btn-secondary" onclick="checkBuilder()">Check My Work</button>
                <button class="btn" onclick="toggleVerify('${sourceId}')">${appState.verifyOpen[sourceId] ? 'Hide' : 'Verify'} with APA Style</button>
              </div>
            </div>
          </div>

          ${feedback ? `
            <div class="feedback-columns">
              <div class="feedback-card success">
                <h4>Tier 1: Correct Identification</h4>
                ${feedback.tier1.length ? `<ul>${feedback.tier1.map(item => `<li>${escapeHtml(item)}</li>`).join('')}</ul>` : '<p>No correct identifications recorded yet.</p>'}
              </div>
              <div class="feedback-card warn">
                <h4>Tier 2: APA Conversion Needed</h4>
                ${feedback.tier2.length ? `<ul>${feedback.tier2.map(item => `<li>${escapeHtml(item)}</li>`).join('')}</ul>` : '<p>No conversion issues detected right now.</p>'}
              </div>
              <div class="feedback-card danger">
                <h4>Tier 3: Incorrect Understanding</h4>
                ${feedback.tier3.length ? `<ul>${feedback.tier3.map(item => `<li>${escapeHtml(item)}</li>`).join('')}</ul>` : '<p>No blocking misunderstandings detected.</p>'}
              </div>
            </div>
            <div class="footer-actions">
              <div class="small">${feedback.canComplete ? 'This source is complete. You can move on, even if some APA conversion reminders remain.' : 'You need to correct Tier 3 issues before this source is marked complete.'}</div>
              <button class="btn btn-primary" ${feedback.canComplete ? '' : 'disabled'} onclick="moveToNextSource()">${appState.currentSourceIndex === sourceOrder.length - 1 ? 'Finish Lab' : 'Next Source'}</button>
            </div>
          ` : ''}

          ${appState.verifyOpen[sourceId] ? `
            <div class="verify-panel">
              <strong>4. Verify with APA Style</strong>
              <p class="small">Use this support panel to compare your work against a correct APA model. This is optional support, not a required redirect.</p>
              <div class="reference-preview">${source.buildReference()}</div>
              <p class="small">Compare with official examples at <a href="${APA_LINK}" target="_blank" rel="noopener noreferrer">APA Style reference examples</a>.</p>
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderCompletion() {
      return `
        <div class="panel">
          <h2>Completion Badge</h2>
          <p>You finished the lab. Generate a badge image with your name and either copy it to your clipboard or download it as a PNG.</p>
        </div>

        <div class="panel badge-stage">
          <div>
            <div class="field">
              <label for="completionName">Name on badge</label>
              <input id="completionName" type="text" value="${escapeHtml(appState.userName)}" oninput="appState.userName=this.value; setTimeout(drawBadge, 0);" placeholder="Enter your name" />
            </div>
            <div class="callout" style="margin-top:16px;">
              Your badge is based on successful completion of the example phase and all builder source types.
            </div>
            <ul class="mini-list">
              <li>Copy image for quick pasting into a document or LMS submission space.</li>
              <li>Download PNG to save the badge as a file.</li>
              <li>The lab does not require a completion code.</li>
            </ul>
            <div class="footer-actions" style="margin-top:22px;">
              <button class="btn btn-secondary" onclick="copyBadge()">Copy Badge Image</button>
              <button class="btn btn-primary" onclick="downloadBadge()">Download PNG</button>
            </div>
          </div>
          <div class="badge-box">
            <canvas id="badgeCanvas" width="900" height="900"></canvas>
          </div>
        </div>
      `;
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function render() {
      const app = document.getElementById('app');
      let body = '';
      if (appState.currentView === 'orientation') body = renderOrientation();
      if (appState.currentView === 'examples') body = renderExamples();
      if (appState.currentView === 'builder') body = renderBuilder();
      if (appState.currentView === 'completion') body = renderCompletion();

      app.innerHTML = `
        ${renderTopBar()}
        ${renderProgress()}
        ${body}
      `;

      if (appState.currentView === 'completion') {
        drawBadge();
      }
    }

    render();
  </script>
</body>
</html>
